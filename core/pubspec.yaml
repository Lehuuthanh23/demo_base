name: core
description: A new Flutter package project.
version: 0.0.1
homepage: "https"

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  device_info_plus: any
  dio: any
  equatable: any
  fast_rsa: any
  file_picker: ^11.0.0
  flutter_bloc: any
  flutter_easyloading: any
  flutter_secure_storage: any
  flutter_spinkit: 5.1.0
  get_it: any
  google_fonts: any
  image_picker: any
  intl: any
  shared_preferences: any
  wechat_assets_picker: any
  flutter_svg: any
  go_router: any
  flutter_dotenv: any
  geolocator: any
  money2: any
  uuid: ^4.5.1

dependency_overrides:
  photo_manager: ^3.0.0-dev.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

